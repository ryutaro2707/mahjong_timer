<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4 Player Timer</title>

<style>
body {
    font-family: Helvetica, sans-serif;
    margin: 0;
    background: #e9e9e9;
    text-align: center;
    font-size: 4vw;
}

/* ===== 設定 ===== */
#setup {
    padding: 5vw 0 20vw 0;
}

.inputBox {
    margin: 3vw;
}

input {
    font-size: 5vw;
    padding: 2vw;
    width: 70%;
}

/* ===== プレイヤー ===== */
.player {
    width: 95%;
    margin: 4vw auto;
    padding: 5vw;
    background: white;
    border-radius: 4vw;
    box-shadow: 0 2vw 5vw rgba(0,0,0,0.2);
}

.name {
    font-size: 6vw;
    font-weight: bold;
}

.time {
    font-size: 18vw;
    font-weight: bold;
    line-height: 1;
}

/* 状態色 */
.active { background: #fff7a8; }
.warning { background: #ffe08a !important; }
.danger { background: #ffb3b3 !important; }

/* ===== ボタン ===== */
button {
    font-size: 5vw;
    padding: 4vw 6vw;
    margin: 2vw;
    border: none;
    border-radius: 3vw;
    color: white;
}

#beginBtn { background: #4CAF50; font-size: 6vw; }
#startBtn { background: #4CAF50; }
#stopBtn  { background: #f44336; }
#nextBtn  { background: #2196F3; }
#fullBtn  { background: #333; }

.controls {
    margin: 5vw 0;
}
</style>
</head>

<body>

<h1>4 Player Timer</h1>

<!-- ===== 設定画面 ===== -->
<div id="setup">

    <h2>設定</h2>

    <div class="inputBox">P1 <input id="p1" value="Player 1"></div>
    <div class="inputBox">P2 <input id="p2" value="Player 2"></div>
    <div class="inputBox">P3 <input id="p3" value="Player 3"></div>
    <div class="inputBox">P4 <input id="p4" value="Player 4"></div>

    <div class="inputBox">初期時間（分） <input id="time" value="5"></div>
    <div class="inputBox">猶予時間（秒） <input id="grace" value="5"></div>

    <button id="beginBtn">START</button>
</div>

<!-- ===== メイン ===== -->
<div id="timer" style="display:none;">

    <div id="players"></div>

    <div class="controls">
        <button id="startBtn">START</button>
        <button id="stopBtn">STOP</button>
        <button id="nextBtn">NEXT</button>
        <button id="fullBtn">FULLSCREEN</button>
    </div>
</div>

<script>

/* =====================
   音
===================== */
const beepShort = new Audio("beep_short.wav");
const beepLong  = new Audio("beep_long.wav");

/* 安全再生 */
function playSafe(audio){
    if(!audio) return;
    audio.currentTime = 0;
    audio.play().catch(()=>{});
}

/* =====================
   状態
===================== */
let players = [];
let current = 0;
let running = false;
let startTime = 0;
let elapsedTotal = 0;

let baseTime = 0;
let grace = 5;

/* ★重要：タイムアウト制御 */
let timeoutPlayed = false;

/* =====================
   時間計算
===================== */
function getRemaining(p, i){

    let elapsed = elapsedTotal;

    if(running && i === current){
        elapsed += (Date.now() - startTime) / 1000;
    }

    if(elapsed > grace){
        return p.time - (elapsed - grace);
    }

    return p.time;
}

/* =====================
   表示
===================== */
function format(sec){
    sec = Math.max(0, Math.ceil(sec));
    return String(Math.floor(sec/60)).padStart(2,'0') + ":" +
           String(sec%60).padStart(2,'0');
}

/* =====================
   初期化
===================== */
beginBtn.onclick = () => {

    baseTime = parseInt(time.value) * 60;
    grace = parseInt(grace.value);

    players = [
        {name:p1.value, time:baseTime},
        {name:p2.value, time:baseTime},
        {name:p3.value, time:baseTime},
        {name:p4.value, time:baseTime},
    ];

    setup.style.display = "none";
    timer.style.display = "block";

    render();
};

/* =====================
   描画
===================== */
function render(){

    const container = document.getElementById("players");
    container.innerHTML = "";

    players.forEach((p,i)=>{

        let t = getRemaining(p,i);
        let div = document.createElement("div");

        div.className = "player";

        if(t <= 0){
            div.classList.add("danger");

            /* ★タイムアウト音（確実に1回だけ） */
            if(i === current && !timeoutPlayed){
                playSafe(beepLong);
                timeoutPlayed = true;
            }
        }

        div.innerHTML = `
            <div class="name">${p.name}</div>
            <div class="time">${format(t)}</div>
        `;

        container.appendChild(div);
    });
}

/* =====================
   ループ
===================== */
function tick(){
    render();
    if(running) requestAnimationFrame(tick);
}

/* =====================
   操作
===================== */
startBtn.onclick = () => {

    /* 音アンロック */
    playSafe(beepShort);

    running = true;
    startTime = Date.now();
    tick();
};

stopBtn.onclick = () => {
    running = false;
    elapsedTotal += (Date.now() - startTime)/1000;
};

nextBtn.onclick = () => {

    /* 次ターンでリセット */
    timeoutPlayed = false;

    current = (current + 1) % 4;
    startTime = Date.now();
    elapsedTotal = 0;
};

fullBtn.onclick = () => {
    document.documentElement.requestFullscreen();
};

</script>

</body>
</html>
