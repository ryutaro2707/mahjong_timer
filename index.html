<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Player Timer</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    background: #e9e9e9;
}

#setup {
    padding: 20px;
}

input {
    font-size: 18px;
    padding: 5px;
    width: 70%;
    margin: 5px;
}

button {
    font-size: 18px;
    padding: 10px 20px;
    margin: 5px;
}

.player {
    margin: 10px auto;
    padding: 10px;
    width: 90%;
    background: white;
    border-radius: 10px;
}

.time {
    font-size: 40px;
    font-weight: bold;
}

.sub {
    font-size: 14px;
    color: gray;
}

.active {
    background: #ffe08a;
}

.danger {
    background: #ffb3b3;
}
</style>
</head>

<body>

<h2>タイマー設定</h2>

<div id="setup">
    P1 <input id="p1" value="P1"><br>
    P2 <input id="p2" value="P2"><br>
    P3 <input id="p3" value="P3"><br>
    P4 <input id="p4" value="P4"><br>

    時間(分) <input id="time" value="5"><br>
    猶予(秒) <input id="grace" value="5"><br>

    <button id="beginBtn">開始</button>
</div>

<div id="main" style="display:none;">
    <div id="players"></div>

    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="nextBtn">Next</button>
</div>

<script>

/* =====================
   Audio（Safari安定版）
===================== */
let ctx = null;
let audioReady = false;

function initAudio(){
    if(audioReady) return;

    ctx = new (window.AudioContext || window.webkitAudioContext)();

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    // 初回解放用の微音
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0.0001;

    o.connect(g);
    g.connect(ctx.destination);

    o.start();
    o.stop(ctx.currentTime + 0.05);

    audioReady = true;
}

function beep(){
    if(!ctx) return;

    if(ctx.state === "suspended"){
        ctx.resume();
    }

    const o = ctx.createOscillator();
    const g = ctx.createGain();

    o.frequency.value = 400;
    g.gain.value = 0.2;

    o.connect(g);
    g.connect(ctx.destination);

    o.start();
    o.stop(ctx.currentTime + 0.8);
}

/* =====================
   状態管理
===================== */
let players = [];
let current = 0;

let running = false;
let startTime = 0;
let elapsed = 0;

let baseTime = 0;
let grace = 5;

let timeoutPlayed = false;

/* DOM */
const playersDiv = document.getElementById("players");

/* =====================
   計算
===================== */
function remaining(p, i){
    let e = elapsed;

    if(running && i === current){
        e += (Date.now() - startTime) / 1000;
    }

    if(e > grace){
        return p.time - (e - grace);
    }

    return p.time;
}

function format(sec){
    sec = Math.max(0, Math.ceil(sec));
    return String(Math.floor(sec/60)).padStart(2,'0') + ":" +
           String(sec%60).padStart(2,'0');
}

/* =====================
   初期化
===================== */
beginBtn.onclick = () => {

    initAudio();

    baseTime = parseInt(time.value) * 60;
    grace = parseInt(grace.value);

    players = [
        {name:p1.value, time:baseTime},
        {name:p2.value, time:baseTime},
        {name:p3.value, time:baseTime},
        {name:p4.value, time:baseTime},
    ];

    setup.style.display = "none";
    main.style.display = "block";

    render();
};

/* =====================
   描画
===================== */
function render(){

    playersDiv.innerHTML = "";

    players.forEach((p,i)=>{

        let t = remaining(p,i);

        let div = document.createElement("div");
        div.className = "player";

        if(i === current) div.classList.add("active");

        if(t <= 0 && i === current){
            div.classList.add("danger");

            if(!timeoutPlayed){
                beep();
                timeoutPlayed = true;
            }
        }

        div.innerHTML = `
            <div>${p.name}</div>
            <div class="time">${format(t)}</div>
            <div class="sub">経過:${Math.floor(elapsed)}</div>
        `;

        playersDiv.appendChild(div);
    });
}

/* =====================
   ループ
===================== */
function tick(){
    render();
    if(running) requestAnimationFrame(tick);
}

/* =====================
   操作
===================== */
startBtn.onclick = () => {
    running = true;
    startTime = Date.now();
    tick();
};

stopBtn.onclick = () => {
    running = false;
    elapsed += (Date.now() - startTime) / 1000;
};

nextBtn.onclick = () => {
    elapsed = 0;
    timeoutPlayed = false;
    current = (current + 1) % 4;
    startTime = Date.now();
};

</script>

</body>
</html>
