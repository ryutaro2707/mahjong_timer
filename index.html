<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 Player Timer</title>

<style>
body {
    font-family: Helvetica, sans-serif;
    margin: 0;
    background: #e9e9e9;
    text-align: center;
    font-size: 4vw;
}

#setup {
    padding: 5vw 0 20vw 0;
}

.inputBox {
    margin: 3vw;
}

input {
    font-size: 5vw;
    padding: 2vw;
    width: 70%;
}

.player {
    width: 95%;
    margin: 4vw auto;
    padding: 5vw;
    background: white;
    border-radius: 4vw;
}

.name {
    font-size: 6vw;
    font-weight: bold;
}

.time {
    font-size: 18vw;
    font-weight: bold;
}

button {
    font-size: 5vw;
    padding: 4vw 6vw;
    margin: 2vw;
    border: none;
    border-radius: 3vw;
    color: white;
}

#beginBtn { background: #4CAF50; font-size: 6vw; }
#startBtn { background: #4CAF50; }
#stopBtn  { background: #f44336; }
#nextBtn  { background: #2196F3; }
</style>
</head>

<body>

<h1>4 Player Timer</h1>

<div id="setup">
    <h2>設定</h2>

    <div class="inputBox">P1 <input id="p1" value="Player 1"></div>
    <div class="inputBox">P2 <input id="p2" value="Player 2"></div>
    <div class="inputBox">P3 <input id="p3" value="Player 3"></div>
    <div class="inputBox">P4 <input id="p4" value="Player 4"></div>

    <div class="inputBox">初期時間（分） <input id="time" value="5"></div>
    <div class="inputBox">猶予時間（秒） <input id="grace" value="5"></div>

    <button id="beginBtn">START</button>
</div>

<div id="timer" style="display:none;">
    <div id="players"></div>

    <button id="startBtn">START</button>
    <button id="stopBtn">STOP</button>
    <button id="nextBtn">NEXT</button>
</div>

<script>

/* =====================
   WebAudio（完全版）
===================== */
let audioCtx = null;
let unlocked = false;

function unlockAudio(){

    if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }

    // ★初回プライミング（これが最重要）
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = 440;
    gain.gain.value = 0.0001; // ほぼ無音

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);

    unlocked = true;
}

/* 短い音 */
function beepShort(){
    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = 800;
    gain.gain.value = 0.1;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

/* タイムアウト音 */
function beepLong(){
    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.frequency.value = 400;
    gain.gain.value = 0.2;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 1.0);
}

/* =====================
   状態
===================== */
let players = [];
let current = 0;
let running = false;
let startTime = 0;
let elapsedTotal = 0;

let baseTime = 0;
let grace = 5;

let timeoutPlayed = false;

/* =====================
   計算
===================== */
function getRemaining(p, i){

    let elapsed = elapsedTotal;

    if(running && i === current){
        elapsed += (Date.now() - startTime) / 1000;
    }

    if(elapsed > grace){
        return p.time - (elapsed - grace);
    }

    return p.time;
}

function format(sec){
    sec = Math.max(0, Math.ceil(sec));
    return String(Math.floor(sec/60)).padStart(2,'0') + ":" +
           String(sec%60).padStart(2,'0');
}

/* =====================
   初期化
===================== */
beginBtn.onclick = () => {

    unlockAudio(); // ★ここで確実に解放

    baseTime = parseInt(time.value) * 60;
    grace = parseInt(grace.value);

    players = [
        {name:p1.value, time:baseTime},
        {name:p2.value, time:baseTime},
        {name:p3.value, time:baseTime},
        {name:p4.value, time:baseTime},
    ];

    setup.style.display = "none";
    timer.style.display = "block";

    render();
};

/* =====================
   描画
===================== */
function render(){

    const container = document.getElementById("players");
    container.innerHTML = "";

    players.forEach((p,i)=>{

        let t = getRemaining(p,i);
        let div = document.createElement("div");

        div.className = "player";

        if(t <= 0 && i === current && !timeoutPlayed){
            beepLong();              // ★確実発火
            timeoutPlayed = true;    // ★1回だけ
        }

        div.innerHTML = `
            <div class="name">${p.name}</div>
            <div class="time">${format(t)}</div>
        `;

        container.appendChild(div);
    });
}

/* =====================
   ループ
===================== */
function tick(){
    render();
    if(running) requestAnimationFrame(tick);
}

/* =====================
   操作
===================== */
startBtn.onclick = () => {

    unlockAudio(); // ★念押し（Safari対策）

    running = true;
    startTime = Date.now();
    tick();
};

stopBtn.onclick = () => {
    running = false;
    elapsedTotal += (Date.now() - startTime)/1000;
};

nextBtn.onclick = () => {
    timeoutPlayed = false;
    current = (current + 1) % 4;
    startTime = Date.now();
    elapsedTotal = 0;
};

</script>

</body>
</html>
