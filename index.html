<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Timer</title>

<style>
body {
    font-family: sans-serif;
    text-align: center;
    margin: 0;
    background: #eee;
}

.screen {
    display: none;
    padding: 20px;
}

.screen.active {
    display: block;
}

input {
    font-size: 18px;
    padding: 5px;
    width: 70%;
    margin: 5px;
}

button {
    font-size: 18px;
    padding: 10px 20px;
    margin: 5px;
}

.player {
    background: white;
    margin: 10px auto;
    padding: 10px;
    width: 90%;
    border-radius: 10px;
}

.time {
    font-size: 40px;
}

.sub {
    font-size: 14px;
    color: gray;
}
</style>
</head>

<body>

<!-- 設定画面 -->
<div id="setup" class="screen active">
    <h2>設定</h2>

    P1 <input id="p1" value="P1"><br>
    P2 <input id="p2" value="P2"><br>
    P3 <input id="p3" value="P3"><br>
    P4 <input id="p4" value="P4"><br>

    時間(分) <input id="time" value="5"><br>

    <button id="startSetup">開始</button>
</div>

<!-- タイマー画面 -->
<div id="main" class="screen">

    <div id="players"></div>

    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="next">Next</button>
</div>

<script>

/* DOM */
const setup = document.getElementById("setup");
const main = document.getElementById("main");
const playersDiv = document.getElementById("players");

/* 入力 */
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");
const p3 = document.getElementById("p3");
const p4 = document.getElementById("p4");
const timeInput = document.getElementById("time");

/* 状態 */
let players = [];
let current = 0;
let running = false;
let startTime = 0;
let elapsed = 0;
let baseTime = 0;

/* 画面切替 */
document.getElementById("startSetup").onclick = () => {

    baseTime = parseInt(timeInput.value || "0") * 60;

    players = [
        {name:p1.value, time:baseTime},
        {name:p2.value, time:baseTime},
        {name:p3.value, time:baseTime},
        {name:p4.value, time:baseTime},
    ];

    setup.classList.remove("active");
    main.classList.add("active");

    render();
};

/* 表示 */
function render(){

    playersDiv.innerHTML = "";

    players.forEach((p,i)=>{

        let t = p.time;

        if(running && i === current){
            t -= (Date.now() - startTime)/1000;
        }

        t = Math.max(0, Math.ceil(t));

        let div = document.createElement("div");
        div.className = "player";

        div.innerHTML = `
            <div>${p.name}</div>
            <div class="time">${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</div>
            <div class="sub">経過:${Math.floor(elapsed)}</div>
        `;

        playersDiv.appendChild(div);
    });
}

/* ループ */
function tick(){
    render();
    if(running) requestAnimationFrame(tick);
}

/* 操作 */
document.getElementById("start").onclick = () => {
    running = true;
    startTime = Date.now();
    tick();
};

document.getElementById("stop").onclick = () => {
    running = false;
    elapsed += (Date.now() - startTime)/1000;
};

document.getElementById("next").onclick = () => {
    current = (current + 1) % 4;
    startTime = Date.now();
};

</script>

</body>
</html>
