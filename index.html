<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
body { font-family: sans-serif; text-align: center; }

.player {
    margin: 10px;
    padding: 10px;
    background: #fff;
}

.time { font-size: 40px; }
.sub { font-size: 14px; color: gray; }

.active { background: #ffe08a; }
.danger { background: #ffb3b3; }
</style>
</head>

<body>

<h2>設定</h2>
P1 <input id="p1" value="P1"><br>
P2 <input id="p2" value="P2"><br>
P3 <input id="p3" value="P3"><br>
P4 <input id="p4" value="P4"><br>

時間(分) <input id="time" value="5"><br>
猶予(秒) <input id="grace" value="5"><br>

<button id="begin">開始</button>

<div id="main" style="display:none;">
<div id="players"></div>

<button id="start">Start</button>
<button id="stop">Stop</button>
<button id="next">Next</button>
</div>

<script>

/* ===== 音 ===== */
let ctx;
let audioReady=false;

function initAudio(){
    if(audioReady) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    ctx.resume();

    const o=ctx.createOscillator();
    const g=ctx.createGain();
    g.gain.value=0.0001;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.05);

    audioReady=true;
}

function beep(){
    if(!ctx) return;
    if(ctx.state==="suspended") ctx.resume();

    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.frequency.value=400;
    g.gain.value=0.2;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime+1);
}

/* ===== 状態 ===== */
let players=[];
let current=0;
let running=false;
let startTime=0;
let elapsed=0;

let base=0;
let grace=5;

let timeoutPlayed=false;

/* ===== 計算 ===== */
function remain(p,i){
    let e=elapsed;
    if(running && i===current){
        e += (Date.now()-startTime)/1000;
    }

    if(e>grace){
        return p.time-(e-grace);
    }
    return p.time;
}

function fmt(s){
    s=Math.max(0,Math.ceil(s));
    return String(Math.floor(s/60)).padStart(2,'0')+":"+
           String(s%60).padStart(2,'0');
}

/* ===== 初期化 ===== */
begin.onclick=()=>{
    initAudio();

    base=parseInt(time.value)*60;
    grace=parseInt(grace.value);

    players=[
        {name:p1.value,time:base},
        {name:p2.value,time:base},
        {name:p3.value,time:base},
        {name:p4.value,time:base},
    ];

    main.style.display="block";
};

/* ===== 描画 ===== */
function render(){
    playersDiv.innerHTML="";
    players.forEach((p,i)=>{
        let t=remain(p,i);
        let div=document.createElement("div");

        div.className="player";
        if(i===current) div.classList.add("active");

        if(t<=0 && i===current && !timeoutPlayed){
            beep();
            timeoutPlayed=true;
            div.classList.add("danger");
        }

        div.innerHTML=`
        <div>${p.name}</div>
        <div class="time">${fmt(t)}</div>
        <div class="sub">経過:${Math.floor(elapsed)}</div>
        `;

        playersDiv.appendChild(div);
    });
}

/* ===== ループ ===== */
function tick(){
    render();
    if(running) requestAnimationFrame(tick);
}

/* ===== 操作 ===== */
start.onclick=()=>{
    running=true;
    startTime=Date.now();
    tick();
};

stop.onclick=()=>{
    running=false;
    elapsed += (Date.now()-startTime)/1000;
};

next.onclick=()=>{
    elapsed=0;
    timeoutPlayed=false;
    current=(current+1)%4;
    startTime=Date.now();
};

</script>

</body>
</html>
